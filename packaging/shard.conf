# Shard profile for this package.
#
# The launcher reads these and passes them to the client as "-login HOST,PORT".
# Change them to point the same package at a different server.

SHARD_NAME=Ignis UO
SHARD_HOST=uo.jmaul.co.uk
SHARD_PORT=2593

# Orion client version reported to the shard. Leave empty to use the version
# this binary was built with (currently 1.0.37.0). Set it if the shard starts
# rejecting logins with "This server requires the latest ORION version" -
# current builds are listed at
# http://orionuo.online/Updates5152/BackupsList64.html
ORION_VERSION=
