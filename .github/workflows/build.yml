name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja sdl2 sdl2_mixer glew

      - name: Configure
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build OrionUO

      # The renderer draws through a shader and a vertex buffer rather than the
      # fixed function pipeline, and this checks the two produce the same pixels.
      # It needs a GL context, which the macOS runners provide; the Linux ones do
      # not without a display server, so it only runs here.
      - name: Renderer equivalence test
        run: ./tests/vertexbatch/run.sh

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: orionuo-macos-arm64
          path: build/OrionUO/OrionUO
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake \
            libsdl2-dev libsdl2-mixer-dev \
            libglew-dev libglu1-mesa-dev xorg-dev

      - name: Configure
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build OrionUO

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: orionuo-linux-x86_64
          path: build/OrionUO/OrionUO
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows builds against the libraries committed under Dependencies/, so
      # there is nothing to install. This job has never been run before it was
      # written, so treat a failure here as information rather than a surprise.
      - name: Configure
        run: cmake -A x64 -S . -B build

      - name: Build
        run: cmake --build build --config Release --target OrionUO

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: orionuo-windows-x64
          path: build/OrionUO/Release/OrionUO.exe
          if-no-files-found: error

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # d8 rejects class files from the newest JDKs, so pin the one Android's
      # own tooling is built against rather than whatever the image defaults to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip \
            libsdl2-dev libsdl2-mixer-dev \
            libglew-dev libglu1-mesa-dev xorg-dev

      # tools/android-build.sh takes the list of sources from the desktop build's
      # compile database - a bare find would pick up the Windows-only files CMake
      # never compiles. Configuring is enough; nothing here has to be built.
      - name: Configure the desktop build for its compile database
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # SDL2 and SDL2_mixer are cross-built from source and take several minutes;
      # they only change when the pinned versions do.
      - name: Cache SDL2 for Android
        uses: actions/cache@v4
        with:
          path: ~/.cache/orionuo-android/sdl2
          key: android-sdl2-2.32.10-mixer-2.8.1

      - name: Build SDL2 and SDL2_mixer for Android
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          ./tools/android-build-deps.sh

      - name: Build libmain.so
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          ./tools/android-build.sh

      - name: Build the APK
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK="$ANDROID_HOME"
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ./tools/android-build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orionuo-android-arm64
          path: build-android/apk/orionuo.apk
          if-no-files-found: error
