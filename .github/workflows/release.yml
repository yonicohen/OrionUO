name: Release

# Tag a commit to publish: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write
  # Signing a provenance statement for each artifact, so a download can be tied
  # back to the commit and the workflow that produced it.
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            runner: macos-latest
            artifact: orionuo-macos-arm64
            ignis: ignis-uo-macos-arm64
            binary: build/OrionUO/OrionUO
          - name: Linux (x86_64)
            runner: ubuntu-latest
            artifact: orionuo-linux-x86_64
            ignis: ignis-uo-linux-x86_64
            binary: build/OrionUO/OrionUO
          - name: Windows (x64)
            runner: windows-latest
            artifact: orionuo-windows-x64
            ignis: ignis-uo-windows-x64
            binary: build/OrionUO/Release/OrionUO.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases come from master only. A tag can be pushed pointing anywhere, and
      # publishing a build of some half-finished branch as a release is worse than
      # not publishing at all.
      - name: Verify the tag is on master
        shell: bash
        run: |
          set -eu
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/master - refusing to release."
            exit 1
          fi
          echo "Tagged commit is on master."

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja sdl2 sdl2_mixer glew

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake \
            libsdl2-dev libsdl2-mixer-dev \
            libglew-dev libglu1-mesa-dev xorg-dev

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release
          ninja -C build OrionUO

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -A x64 -S . -B build
          cmake --build build --config Release --target OrionUO

      # The client plus what CMake stages next to it - on Unix that is the MIDI
      # soundfont, without which .mid music will not play at all; on Windows it is
      # also the bundled DLLs. OrionData is not copied: the client generates it on
      # first run.
      #
      # UO's own data files are never redistributed. They are copyright. The
      # setup script in the package links them out of an install the player
      # already has; see IGNIS_UO.md.
      - name: Package
        shell: bash
        run: |
          set -eu
          binary_dir="$(dirname "${{ matrix.binary }}")"

          mkdir -p package
          cp "${{ matrix.binary }}" package/
          cp README.md package/

          # Everything the build staged beside the binary, skipping CMake's own
          # bookkeeping and anything the client wrote while being built.
          for staged in "$binary_dir"/*; do
            name="$(basename "$staged")"
            case "$name" in
              CMakeFiles|cmake_install.cmake|*.cmake|OrionUO|OrionUO.exe) continue ;;
              crashlogs|snapshots|Desktop|OrionData|uo_debug.cfg) continue ;;
            esac
            cp -R "$staged" package/ || true
          done

          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x package/OrionUO
          fi

          # Two downloads per platform. The plain client is just that - the
          # client, for anyone who already has a shard set up and does not want
          # our launcher deciding things for them.
          echo "Packaged (client):"
          ls -la package
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

          # The Ignis package is the same client with the server already chosen
          # and a setup script: shard.conf names the server, the launcher passes
          # it to the client as -login, and setup stages the player's own UO data
          # next to the binary. make_client_cuo.py is what lets a stock uo.com
          # install work - it has no Client.cuo, which only the Windows-only
          # Orion Launcher normally writes.
          cp -R package ignis
          cp IGNIS_UO.md ignis/
          cp packaging/shard.conf ignis/
          # The icon for the app bundle setup.sh builds on macOS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp packaging/OrionUO.icns ignis/
          fi
          cp tools/make_client_cuo.py ignis/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packaging/setup.cmd packaging/setup.ps1 packaging/play-ignis.cmd ignis/
          else
            cp packaging/setup.sh packaging/play-ignis.sh ignis/
            chmod +x ignis/setup.sh ignis/play-ignis.sh ignis/OrionUO
          fi

          echo "Packaged (Ignis):"
          ls -la ignis
          tar -czf "${{ matrix.ignis }}.tar.gz" -C ignis .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ignis }}
          path: ${{ matrix.ignis }}.tar.gz
          if-no-files-found: error


  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on master
        shell: bash
        run: |
          set -eu
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/master - refusing to release."
            exit 1
          fi
          echo "Tagged commit is on master."

      # d8 rejects class files from the newest JDKs, so pin the one Android's
      # own tooling is built against rather than whatever the image defaults to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip \
            libsdl2-dev libsdl2-mixer-dev \
            libglew-dev libglu1-mesa-dev xorg-dev

      # tools/android-build.sh takes the list of sources from the desktop build's
      # compile database - a bare find would pick up the Windows-only files CMake
      # never compiles. Configuring is enough; nothing here has to be built.
      - name: Configure the desktop build for its compile database
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Cache SDL2 for Android
        uses: actions/cache@v4
        with:
          path: ~/.cache/orionuo-android/sdl2
          key: android-sdl2-2.32.10-mixer-2.8.1

      - name: Build SDL2 and SDL2_mixer for Android
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          ./tools/android-build-deps.sh

      - name: Build libmain.so
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          ./tools/android-build.sh

      # Android replaces an installed app only with one signed by the same key.
      # With ANDROID_KEYSTORE_BASE64 set, every release is upgradable over the
      # last; without it each build gets a throwaway debug key and the previous
      # version has to be uninstalled first.
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK="$ANDROID_HOME"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a throwaway debug key, so this APK cannot be installed over a previous release."
          fi

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          export ANDROID_VERSION_NAME="${tag#v}"
          export ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"

          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ./tools/android-build-apk.sh

          mv build-android/apk/orionuo.apk "orionuo-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: orionuo-android-arm64
          path: orionuo-android-arm64.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Binds each file's digest to this repository, this commit and this
      # workflow run, signed through Sigstore. Anyone can check a download with
      #   gh attestation verify <file> -R ${{ github.repository }}
      # and be told which commit it was built from - without trusting us, the
      # release page, or whoever mirrored it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.apk

      # For anyone who would rather check a checksum by hand than install the gh
      # CLI. Written into the release notes below.
      - name: Checksums
        id: checksums
        shell: bash
        run: |
          set -eu
          {
            echo "sums<<CHECKSUMS_EOF"
            (cd artifacts && find . -type f \( -name '*.tar.gz' -o -name '*.apk' \) |
              sort | xargs shasum -a 256 | sed 's#\./[^/]*/##')
            echo "CHECKSUMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
          body: |
            Two downloads per platform.

            **`ignis-uo-*`** - the client set up to play
            [Ignis UO](https://uo.jmaul.co.uk) (`uo.jmaul.co.uk:2593`). Unpack it
            and run the setup script; it asks where your Ultima Online folder is,
            links the data in and starts the game.

            ```
            mkdir ignis && tar -xzf ignis-uo-macos-arm64.tar.gz -C ignis
            cd ignis && ./setup.sh
            ```

            On Windows, double-click `setup.cmd`. Afterwards `play-ignis.sh` /
            `play-ignis.cmd` starts the game directly.

            **`orionuo-*`** - the client on its own, with no shard chosen and no
            setup script. Run it from a folder containing UO's data files, and
            point it at a server yourself:

            ```
            ./OrionUO "-login your.shard.example,2593"
            ```

            The quotes matter: the argument parser splits on spaces and commas, so
            an unquoted `-login` is ignored and the client falls back to
            `login.cfg`.

            **The UO data files are not included** in either download. They are
            EA/Broadsword copyright and cannot be redistributed. Bring them from an
            install you already have - your shard's download, or the free Classic
            Client from https://uo.com/client-download/ . Setup links them in place:
            nothing is copied into your UO folder and nothing there is modified.

            **`orionuo-android-arm64.apk`** - the Android build, for arm64 phones
            and tablets. Sideload it, then push your UO data onto the device; the
            client reads it from its own external files directory. See
            `docs/ANDROID.md` for the `adb` commands and the touch controls.

            The Windows and Linux builds come from the same source but have had far
            less use than the macOS one, which is the platform this port was made for.

            ---

            **Verifying a download.** Every file here is built by GitHub Actions
            from this repository and carries a signed provenance statement tying
            it to the commit it was built from. To check one:

            ```
            gh attestation verify orionuo-android-arm64.apk -R ${{ github.repository }}
            ```

            That reports the commit SHA and workflow that produced the file, and
            fails if the bytes were altered or the file came from anywhere else.

            SHA-256, if you would rather check by hand:

            ```
            ${{ steps.checksums.outputs.sums }}
            ```

            The Android APK is signed with the same key on every release, so one
            of these will install over the last; an APK from anywhere else will
            not.
